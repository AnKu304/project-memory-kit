[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "project-memory-kit"
version = "0.3.0"
description = "Installer for local Dependency Graph RAG project memory"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "AnKu304" }
]
keywords = [
  "codex",
  "agents",
  "project-memory",
  "dependency-graph",
  "rag",
  "sqlite",
  "qdrant"
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pathspec>=0.12",
  "PyYAML>=6"
]

[project.optional-dependencies]
vector = [
  "qdrant-client>=1.9",
  "fastembed>=0.3"
]
test = [
  "pytest>=8"
]

[project.scripts]
pmem = "project_memory_kit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/project_memory_kit"]
