version: 1
project:
  name: auto
paths:
  graph_db: .project-memory/graph.sqlite
  qdrant_path: .project-memory/qdrant
  reports_dir: .project-memory/reports
  logs_dir: .project-memory/logs
  cache_dir: .project-memory/cache
  knowledge_dir: .project-memory/knowledge
  rationale_dir: .project-memory/rationale
  human_dir: .project-memory/human
  models_dir: .project-memory/models
indexing:
  auto_index:
    enabled: true
    mode: changed
    commands:
      - search
      - context
      - impact
      - tests
  include_extensions:
    - .py
    - .js
    - .jsx
    - .ts
    - .tsx
    - .mjs
    - .cjs
    - .mts
    - .cts
    - .md
    - .txt
    - .toml
    - .yaml
    - .yml
    - .json
  ignore:
    - .git/
    - .project-memory/
    - __pycache__/
    - .venv/
    - venv/
    - node_modules/
    - tools/project_memory/
    - dist/
    - build/
    - .next/
    - .cache/
    - "*.env"
    - ".env*"
    - "*.pem"
    - "*.key"
    - "*secret*"
    - "*credential*"
tests:
  default_commands:
    - python -m unittest discover
  test_roots:
    - tests
memory:
  max_context_chunks: 8
  vector_size: 64
knowledge:
  max_context_items: 5
rationale:
  max_context_items: 5
modules:
  human:
    enabled: false
vector:
  backend: auto
  collection: project_memory_chunks
  embedding_model: null
